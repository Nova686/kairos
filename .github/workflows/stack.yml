name: stack

on:
  pull_request:
    paths:
      - "deploy/**"
      - "tests/deploy/**"
      - ".github/workflows/stack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file
        run: docker compose -f deploy/compose.yml --env-file deploy/env.example config -q
      - name: Check the backup and restore round trip
        run: bash tests/deploy/backup-restore.sh
